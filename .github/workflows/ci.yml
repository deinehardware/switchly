name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, openssl, pdo_sqlite
          coverage: none

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Qualitätsprüfungen ausführen
        run: bash ./scripts/quality-check.sh